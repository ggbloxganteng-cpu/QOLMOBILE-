name: Build TrajectoryBot

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Android64 - GD 2.2081
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64
          sdk: given
          build-config: Release

      - name: Upload Geode package
        uses: actions/upload-artifact@v4
        with:
          name: TrajectoryBot-Android64
          path: ${{ steps.build.outputs.build-output }}/*.geode
